<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DDE 壁纸切换过渡方案演示</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <div class="app">
    <header class="panel">
      <div class="brand"><h1>桌面过渡</h1></div>
      <div class="controls">
        <label class="ctl"><span>全局 Dark</span><button class="switch on" id="swDark" type="button" role="switch" aria-checked="true"><i></i></button></label>
        <div class="ctl"><span>主题</span>
          <div class="combo" id="comboTheme">
            <button class="combo-btn" id="comboBtn" type="button">湖畔 · 暗色</button>
            <div class="combo-list" id="comboList"></div>
          </div>
        </div>
        <label class="ctl"><span>时长</span><input id="inpDur" type="number" min="0.5" max="20" step="0.5" value="5" /><span>s</span></label>
        <label class="ctl"><span>壁纸模式</span>
          <select id="selWpMode">
            <option value="wipe" selected>擦除 + 淡化</option>
            <option value="spring">右移 + 弹簧压缩</option>
            <option value="roll">右移 + 卷轴</option>
            <option value="flip">左下翻页</option>
          </select>
        </label>
        <label class="ctl"><span>反弹位置</span><input id="inpDetach" type="number" min="15" max="85" step="5" value="50" /><span>%</span></label>
        <label class="ctl"><span>左侧窗口淡入</span><button class="switch on" id="swFadeL" type="button" role="switch" aria-checked="true"><i></i></button></label>
        <label class="ctl"><span>右侧窗口淡出</span><button class="switch on" id="swFadeR" type="button" role="switch" aria-checked="true"><i></i></button></label>
        <button class="btn-ghost" id="btnWp" type="button">下一张壁纸</button>
        <button class="btn-ghost" id="btnReset" type="button">复位</button>
      </div>
    </header>
    <div class="stage-wrap">
      <div class="monitor" id="monitor">
        <div class="viewport">
          <div class="desktop" id="desktop" data-theme="dark">
            <div class="slider" id="slider">
              <section class="screen screen-old"><div class="wallpaper wp-old"></div><div class="layer-windows"></div></section>
              <section class="screen screen-new"><div class="wallpaper wp-new"></div><div class="layer-windows"></div></section>
            </div>
            <div class="dock" aria-hidden="true">
              <div class="dock-ico">🗂</div><div class="dock-ico">🌐</div><div class="dock-ico">🎵</div>
              <div class="dock-ico">🖥</div><div class="dock-ico">🗒</div><div class="dock-sep"></div><div class="dock-ico">⚙</div>
            </div>
            <div class="hud" id="hud"></div>
            <div class="split-guide" id="guide"></div>
          </div>
          <canvas id="gpuFx"></canvas>
          <div class="frame-snap" id="frameSnap"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
